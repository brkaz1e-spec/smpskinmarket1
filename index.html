<!DOCTYPE html>
<html>
<head>
    <title>Skin Price Checker</title>
    <style>
        /* 1. OVERALL THEME (Dark mode) */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        /* 2. PAGE HEADER & GLOW EFFECTS */
        h1 {
            text-align: center;
            font-size: 2.5rem;
            color: #00ffcc; /* Neon Cyan */
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
            margin-bottom: 10px;
        }

        /* 3. SEARCH BAR STYLING */
        .search-container {
            text-align: center;
            margin-bottom: 40px;
        }
        #searchBox {
            padding: 12px 20px;
            width: 300px;
            border-radius: 25px;
            border: 2px solid #333;
            background-color: #1e1e1e;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }
        #searchBox:focus {
            border-color: #00ffcc;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
        }

        /* 4. LAYOUT (Grid system so they sit neatly next to each other) */
        #inventory {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 5. FANCY SKIN CARDS */
        .skin-card {
            background: linear-gradient(145deg, #1a1a1a, #222222);
            border-radius: 12px;
            padding: 20px;
            width: 220px;
            text-align: center;
            /* Cool 3D Shadow effect */
            box-shadow: 5px 5px 15px #070707, -5px -5px 15px #2d2d2d;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        /* Hover animation: Card floats up and glows */
        .skin-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 255, 204, 0.2);
        }

        /* Rarity colors at the top of the card */
        .rarity-bar {
            height: 5px;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        /* 6. IMAGE AND TEXT STYLING */
        .skin-card img {
            width: 100%;
            height: 140px;
            object-fit: contain;
            filter: drop-shadow(0 10px 8px rgba(0,0,0,0.6));
            transition: transform 0.3s ease;
        }
        .skin-card:hover img {
            transform: scale(1.1); /* Image zooms in slightly on hover */
        }
        .skin-name {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 15px 0 5px;
            color: #e0e0e0;
        }
        .skin-price {
            font-size: 1.5rem;
            color: #00ffcc;
            font-weight: 900;
            margin: 0;
        }
    </style>
</head>
<body>

    <h1>Skin Price Checker</h1>
    
    <!-- Added a functional search bar -->
    <div class="search-container">
        <input type="text" id="searchBox" placeholder="Search for a skin..." onkeyup="filterSkins()">
    </div>

    <div id="inventory"></div>

    <script>
        /* 
           YOUR SAVED DATA: Notice I added "rarityColor" 
           to make the top of the cards match the skin rarity!
        */
        const mySkins = [
            {
                name: "AK-47 | Redline",
                price: "$15.50",
                icon: "Images/ak47.jpg",
                rarityColor: "#eb4b4b" /* Red (Covert) */
            },
            {
                name: "AWP | Asiimov",
                price: "$185.32",
                icon: "Images/awp.jpg",
                rarityColor: "#eb4b4b" /* Red (Covert) */
            },
            {
                name: "M4A4 | Neo-Noir",
                price: "$20.00",
                icon: "Images/m4a4.jpg",
                rarityColor: "#d32ce6" /* Pink (Classified) */
            },
            {
                name: "Glock-18 | Water Elemental",
                price: "$10.00",
                icon: "Images/glock.jpg",
                rarityColor: "#d32ce6" 
            },
            {
                name: "USP-S | Cyrex",
                price: "$5.50",
                icon: "Images/usps.jpg",
                rarityColor: "#8847ff" /* Purple (Restricted) */
            }
        ];

        const inventoryDiv = document.getElementById("inventory");

        // Function to draw the skins on the screen
        function displaySkins(skinsToDisplay) {
            inventoryDiv.innerHTML = ""; // Clear the screen first

            for (let i = 0; i < skinsToDisplay.length; i++) {
                let skin = skinsToDisplay[i];
                
                inventoryDiv.innerHTML += `
                    <div class="skin-card">
                        <div class="rarity-bar" style="background-color: ${skin.rarityColor};"></div>
                        <img src="${skin.icon}" alt="Skin Image">
                        <div class="skin-name">${skin.name}</div>
                        <div class="skin-price">${skin.price}</div>
                    </div>
                `;
            }
        }

        // Draw all skins when you first open the website
        displaySkins(mySkins);

        // Function to make the Search Bar work!
        function filterSkins() {
            let searchInput = document.getElementById("searchBox").value.toLowerCase();
            
            // Find skins that match what you typed
            let filteredSkins = mySkins.filter(skin => 
                skin.name.toLowerCase().includes(searchInput)
            );
            
            // Draw only the matching skins
            displaySkins(filteredSkins);
        }
    </script>

</body>
</html>
